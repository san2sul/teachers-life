</style>
</head>

    var html='<!doctype html>\n<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(F.ti+" "+v.no+" "+v.nm)+'</title><style>body{margin:0;background:#eef1f4}'+TLF.css+'.tfother{max-width:760px;margin:0 auto 30px;background:#fff;padding:14px 24px}.tfother a{display:block;margin:6px 0}</style></head><body>'+
      TLF.docHTML(RQ,{nm:v.nm,no:v.no,at:sub.at,d:d,sg:sub.sg,files:fl},{imgs:imgs})+(other.length?'<div class="tfother"><b>첨부 파일 내려받기</b>'+other.map(function(x){return'<a download="'+esc(x.name)+'" href="data:'+esc(x.type)+';base64,'+x.b64+'">📎 '+esc(x.name)+'</a>'}).join("")+'</div>':"")+
      '<script type="application/json" id="tlform-data">'+json+'<\/script></body></html>';
    var name=(F.ti+"_"+v.no+"_"+v.nm).replace(/[\\/:*?"<>|\s]+/g,"_")+".html",file=new File([html],name,{type:"text/html"});
    var small=null;if(!fl.length){var s2=JSON.parse(JSON.stringify(sub));s2.files=[];encode(s2).then(function(c){small=(RQ.ap||"").split("#")[0]+"#fa="+c;show(file,small)})}else show(file,null);
    try{localStorage.removeItem(DK)}catch(e){}})}
function show(file,link){$("frm").hidden=true;$("done").hidden=false;window.scrollTo(0,0);var canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  $("done").innerHTML='<div class="big">📨</div><h2>서류를 만들었습니다</h2><p><b>아래 단추로 선생님께 보내야 제출됩니다.</b></p>'+
    (canShare?'<div class="row"><button class="btn pri" type="button" id="sh">카톡 · 문자 · 메일로 서류 보내기</button></div>':"")+
    '<div class="row"><button class="btn'+(canShare?"":" pri")+'" type="button" id="dl">서류 파일 저장 ('+Math.max(1,Math.round(file.size/1024))+'KB)</button></div>'+(link?'<div class="row"><button class="btn" type="button" id="lk">링크로 보내기 (첨부 없을 때)</button></div>':"")+
    '<ol class="steps"><li>‘보내기’를 누르고 카카오톡의 선생님 대화방(또는 '+(RQ.to?esc(RQ.to)+" 메일":"선생님 메일")+')을 고릅니다.</li><li>보내기 단추가 없으면 ‘서류 파일 저장’ 후, 저장된 파일을 카톡 · 메일에 첨부해 보냅니다.</li><li>선생님은 받은 파일을 앱에 넣어 모읍니다. 파일을 열면 서류를 볼 수 있습니다.</li></ol>';
  if(canShare)$("sh").onclick=function(){navigator.share({files:[file],title:file.name,text:F.ti+" 제출"}).catch(function(){})};
  $("dl").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},3000)};
  if(link)$("lk").onclick=function(){var t=F.ti+" 제출: "+link;if(navigator.share)navigator.share({title:F.ti,text:F.ti+" 제출",url:link}).catch(function(){});else(navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(function(){$("lk").textContent="링크를 복사했습니다"},function(){prompt("아래 링크를 복사하세요",link)})}}
/* 교실 기기(선생님 앱과 같은 기기): 앱 저장소에 바로 넣기 */
function kiosk(sub){var q=indexedDB.open("teachers-life-media",1);q.onupgradeneeded=function(){try{q.result.createObjectStore("m")}catch(e){}};
  q.onsuccess=function(){var db=q.result,tx=db.transaction("m","readwrite"),st=tx.objectStore("m"),meta=JSON.parse(JSON.stringify(sub));meta.files=sub.files.map(function(x){var key="w"+x.id+"k";var bin=atob(x.b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);st.put(new Blob([u],{type:x.type}),key);return{id:x.id,mid:key,name:x.name,type:x.type,size:x.size}});
    tx.oncomplete=function(){var L=[];try{L=JSON.parse(localStorage.getItem("tl-form-inbox")||"[]")}catch(e){}L.push(meta);try{localStorage.setItem("tl-form-inbox",JSON.stringify(L))}catch(e){alert("저장 공간이 부족합니다");return}try{localStorage.removeItem(DK)}catch(e){}
      $("frm").hidden=true;$("done").hidden=false;$("done").innerHTML='<div class="big">✅</div><h2>제출했습니다</h2><p>서류가 선생님 앱에 들어갔습니다. 다음 학생에게 기기를 건네주세요.</p><div class="row"><button class="btn pri" type="button" id="again">다음 학생 작성하기</button></div>';
      $("again").onclick=function(){location.reload()}};tx.onerror=function(){alert("저장하지 못했습니다")}};q.onerror=function(){alert("이 기기에 저장하지 못했습니다")}}
})();
</script>
