<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>교사의 생활 · 글 보기</title>
<link rel="icon" href="icon-192.png">
<style>html{font-size:clamp(15px,13.6px + .36vw,19px);-webkit-text-size-adjust:100%}
@font-face{font-family:"NanumGothic";src:url(NanumGothic-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"NanumGothic";src:url(NanumGothic-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--bg:#f3f5f2;--paper:#fff;--ink:#1d2621;--muted:#5b665f;--line:#dde3de;--accent:#24476b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"NanumGothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;padding:8px 12px;background:rgba(243,245,242,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar b{flex:1;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{min-height:40px;min-width:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.bar button.pri{background:var(--accent);color:#fff;border-color:transparent}
main{max-width:min(53.75rem,100%);margin:16px auto 48px;background:var(--paper);border-radius:16px;padding:clamp(18px,4vw,44px);box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:calc(1rem * var(--vf,1))}
.err{max-width:min(35.0rem,100%);margin:40px auto;padding:20px;background:#fff;border-radius:16px;text-align:center;line-height:1.6}
.foot{text-align:center;font-size:.75rem;color:#8a8f8c;margin:-30px 0 30px}
@media print{.bar,.foot{display:none}body{background:#fff}main{box-shadow:none;margin:0;max-width:none;padding:0}}
</style>
<style id="wvcss"></style>
</head>
<body>
<div class="bar" id="bar" hidden><b id="ttl">글 보기</b><button type="button" id="fsm" aria-label="글자 작게">가−</button><button type="button" id="fsp" aria-label="글자 크게">가＋</button><button type="button" id="prt" aria-label="인쇄">🖨</button><button type="button" class="pri" id="pres">▶ 발표</button></div>
<main class="wv" id="doc" hidden></main>
<div class="foot" id="foot" hidden>교사의 생활에서 만든 글입니다.</div>
<div class="err" id="err" hidden><h2>글을 열 수 없습니다</h2><p id="errMsg"></p></div>
<script src="wrview.js"></script>
<script>
(function(){"use strict";
var $=function(id){return document.getElementById(id)};
function fail(m){$("err").hidden=false;$("errMsg").textContent=m}
var b64d=function(t){var s=atob(t.replace(/-/g,"+").replace(/_/g,"/"));var b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b};
function pump(st,bytes){var w=st.writable.getWriter();w.write(bytes).catch(function(){});w.close().catch(function(){});return new Response(st.readable).arrayBuffer().then(function(a){return new Uint8Array(a)})}
function decode(code){code=code.replace(/\s+/g,"");var tag=code.slice(0,3),body=code.slice(3);
  if(tag==="z1."){if(typeof DecompressionStream!=="function")return Promise.reject(new Error("브라우저가 오래되어 열 수 없습니다. 크롬 · 사파리 최신 버전으로 열어 주세요."));return pump(new DecompressionStream("deflate-raw"),b64d(body)).then(function(b){return JSON.parse(new TextDecoder().decode(b))})}
  if(tag==="b1.")return Promise.resolve(JSON.parse(new TextDecoder().decode(b64d(body))));return Promise.reject(new Error("링크가 올바르지 않습니다."))}
var K=null;function loadMath(){if(window.katex)return Promise.resolve(window.katex);if(K)return K;K=new Promise(function(res,rej){var l=document.createElement("link");l.rel="stylesheet";l.href="vendor/katex/katex.min.css";document.head.appendChild(l);var s=document.createElement("script");s.src="vendor/katex/katex.min.js";s.onload=function(){res(window.katex)};s.onerror=rej;document.head.appendChild(s)});return K}
var m=location.hash.match(/^#v=(.+)$/);
if(!window.WRV){fail("페이지를 다 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 열어 주세요.");return}
if(!m){fail("받은 링크를 눌러 다시 열어 주세요.");return}
$("wvcss").textContent=WRV.css;
decode(decodeURIComponent(m[1])).then(function(p){if(!p||p.k!=="doc"||!p.r||!Array.isArray(p.r.blocks))throw new Error("링크가 올바르지 않습니다.");
  var r=p.r;r.blocks=r.blocks.slice(0,2000);var t=String(r.title||"글").slice(0,120);document.title=t+" · 교사의 생활";$("ttl").textContent=t;
  $("doc").innerHTML=WRV.render(r,{});$("doc").hidden=false;$("bar").hidden=false;$("foot").hidden=false;
  if($("doc").querySelector(".wmath,.wmathb"))loadMath().then(function(k){WRV.paintMath($("doc"),k)}).catch(function(){WRV.paintMath($("doc"),null)});
  var vf=1;try{vf=+localStorage.getItem("tl-view-fs")||1}catch(e){}var setF=function(){document.body.style.setProperty("--vf",vf);try{localStorage.setItem("tl-view-fs",vf)}catch(e){}};setF();
  $("fsp").onclick=function(){vf=Math.min(2,Math.round((vf+.1)*10)/10);setF()};$("fsm").onclick=function(){vf=Math.max(.7,Math.round((vf-.1)*10)/10);setF()};
  $("prt").onclick=function(){window.print()};
  $("pres").onclick=function(){WRV.present(r,{loadMath:loadMath,mode:r.sm||"h1"})};
  if(r.k==="lesson")$("pres").textContent="▶ 수업 화면으로 보기";
}).catch(function(e){fail(e.message||"링크를 읽지 못했습니다.")});
})();
</script>
</body>
</html>
