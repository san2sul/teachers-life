<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>학생 확인 · 서명</title>
<style>
@font-face{font-family:"NanumGothic";src:url("NanumGothic-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"NanumGothic";src:url("NanumGothic-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--bg:#f3f5f2;--paper:#fff;--ink:#1d2621;--muted:#6a756e;--line:#dde3de;--accent:#24476b;--ok:#1f7a4d;--bad:#c0392b;--soft:#e3ebf3}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--paper:#1c2320;--ink:#e7ece8;--muted:#97a39b;--line:#2d3833;--accent:#8fb4dc;--ok:#5fc08e;--bad:#ef7b6e;--soft:#1f2c3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"NanumGothic",system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
h1{font-size:1.25rem;margin:0}h2{font-size:1rem;margin:0 0 8px}
.sub{color:var(--muted);font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td{border-bottom:1px solid var(--line);padding:9px 4px}td:last-child{text-align:right;font-weight:700;font-size:1.05rem;color:var(--accent)}
tr:last-child td{border-bottom:0}
.note{font-size:.88rem;color:var(--muted);margin:8px 0 0}
.msg{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-top:10px;white-space:pre-wrap}
.agree{display:flex;gap:10px;align-items:flex-start;font-weight:700;cursor:pointer}
.agree input{width:22px;height:22px;flex:0 0 auto;margin-top:2px}
.pad{position:relative;border:2px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;aspect-ratio:5/2;width:100%;overflow:hidden}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pad .hint{position:absolute;inset:0;display:grid;place-items:center;color:#9aa49d;font-size:1rem;pointer-events:none}
.pad.off{opacity:.45}
.row{display:flex;gap:8px;margin-top:10px}
.btn{appearance:none;flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:700;font-size:.98rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;padding:0 12px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.warn{color:var(--bad);font-size:.88rem;margin:8px 0 0}
.done{text-align:center}.done .big{font-size:2.6rem}
.steps{margin:6px 0 0;padding-left:1.2em;font-size:.9rem}
[hidden]{display:none!important}
.foot{text-align:center;color:var(--muted);font-size:.75rem}

/* 5.60 휴대폰 화면 고정 */html{overflow-x:hidden}@supports (overflow:clip){html,body{overflow-x:clip}}@media (pointer:coarse){input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),textarea,select,[contenteditable]{font-size:max(16px,1em)}}
</style>
</head>
<body>
<main>
  <section class="card" id="head"><h1 id="title">확인 · 서명</h1><div class="sub" id="who"></div></section>
  <section class="card" id="err" hidden><h2>링크를 열 수 없습니다</h2><p class="note" id="errMsg"></p></section>
  <section class="card" id="scoreBox" hidden><h2 id="boxT">내 점수</h2><table id="scores"></table><div class="msg" id="tnote" hidden></div><p class="note" id="due"></p></section>
  <section class="card" id="signBox" hidden>
    <label class="agree" for="ok"><input type="checkbox" id="ok"> <span id="agT">위 점수를 확인했고, 이의가 없습니다.</span></label>
    <p class="note" id="tipT">점수가 이상하면 서명하지 말고 선생님께 먼저 말씀드리세요.</p>
    <h2 style="margin-top:14px">자필 서명</h2>
    <div class="pad off" id="pad"><canvas id="cv"></canvas><div class="hint" id="hint">위 확인란을 체크한 뒤 여기에 손가락으로 서명하세요</div></div>
    <div class="row"><button class="btn" type="button" id="clear">지우기</button><button class="btn pri" type="button" id="send" disabled>서명 완료</button></div>
  </section>
  <section class="card" id="sendBox" hidden>
    <div class="done"><div class="big">✍️</div><h2>서명을 마쳤습니다</h2></div>
    <p class="note"><b>아직 끝나지 않았습니다.</b> 아래 ‘선생님께 이메일 보내기’를 누르면 메일 앱이 열립니다. 메일 앱에서 <b>보내기</b>를 눌러야 선생님께 서명이 전달됩니다.</p>
    <div class="row"><a class="btn ok" id="mail" href="#">✉️ 선생님께 이메일 보내기</a></div>
    <div class="row"><button class="btn" type="button" id="share">다른 앱으로 보내기</button><button class="btn" type="button" id="copy">서명 링크 복사</button></div>
    <p class="note">메일 앱이 열리지 않으면 ‘서명 링크 복사’를 눌러 선생님 이메일(<b id="to"></b>)로 붙여 넣어 보내세요.</p>
    <div class="row"><button class="btn" type="button" id="redo">서명 다시 하기</button></div>
  </section>
  <p class="foot" id="foot">교사의 생활 · 만든 사람 물리공작소</p>
</main>
<script>
(function(){"use strict";
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var b64u={enc:function(b){var s="";for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")},
  dec:function(t){var s=atob(t.replace(/-/g,"+").replace(/_/g,"/"));var b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}};
function pump(stream,bytes){var w=stream.writable.getWriter();w.write(bytes);w.close();return new Response(stream.readable).arrayBuffer().then(function(a){return new Uint8Array(a)})}
function encode(obj){var bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream==="function")return pump(new CompressionStream("deflate-raw"),bytes).then(function(b){return "z1."+b64u.enc(b)}).catch(function(){return "b1."+b64u.enc(bytes)});
  return Promise.resolve("b1."+b64u.enc(bytes))}
function decode(code){code=code.replace(/\s+/g,"");var tag=code.slice(0,3),body=code.slice(3);
  if(tag==="z1."){if(typeof DecompressionStream!=="function")return Promise.reject(new Error("이 휴대폰 브라우저가 오래되어 열 수 없습니다. 브라우저를 업데이트하거나 다른 브라우저(크롬·사파리)로 열어 주세요."));
    return pump(new DecompressionStream("deflate-raw"),b64u.dec(body)).then(function(b){return JSON.parse(new TextDecoder().decode(b))})}
  if(tag==="b1.")return Promise.resolve(JSON.parse(new TextDecoder().decode(b64u.dec(body))));
  return Promise.reject(new Error("서명 링크가 올바르지 않습니다."))}
function fail(m){$("err").hidden=false;$("errMsg").textContent=m;$("scoreBox").hidden=true;$("signBox").hidden=true}
var P=null,strokes=[],cur=null,W=600,H=240,replyUrl="";
var m=location.hash.match(/^#s=(.+)$/);
if(!m){fail("선생님께 받은 메일이나 문자의 링크를 눌러 다시 열어 주세요.");return}
decode(decodeURIComponent(m[1])).then(function(p){
  if(!p||p.k!=="ev")throw new Error("서명 링크가 올바르지 않습니다.");P=p;
  var sc=!p.kd||p.kd==="score";
  document.title=(p.ti||"수행평가")+(sc?" · 점수 확인":" · 확인 서명");
  $("title").textContent=p.ti||(sc?"수행평가 점수 확인":"확인 · 서명");
  /* 종류별 기본 문구 (링크에는 바뀐 문구만 들어옴) */
  var KD={score:{l:"수행평가 점수 확인",bx:"내 점수",ag:"위 점수를 확인했고, 이의가 없습니다.",tip:"점수에 이의가 있으면 서명하지 말고 선생님께 먼저 말씀해 주세요."},
    act:{l:"활동 참여 확인",bx:"활동 내용",ag:"위 활동에 참여했음을 확인합니다.",tip:"내용이 사실과 다르면 서명하지 말고 선생님께 먼저 말씀해 주세요."},
    notice:{l:"안내문 · 가정통신문 확인",bx:"안내 내용",ag:"위 안내 내용을 읽고 확인했습니다.",tip:"궁금한 점은 서명 전에 선생님께 물어보세요."},
    agree:{l:"동의서 · 서약서",bx:"동의 내용",ag:"위 내용을 읽고 이에 동의합니다.",tip:"동의하지 않으면 서명하지 말고 선생님께 말씀해 주세요."},
    custom:{l:"직접 입력",bx:"확인 내용",ag:"위 내용을 확인했습니다.",tip:"내용이 다르면 서명하지 말고 선생님께 먼저 말씀해 주세요."}};
  var d0=KD[p.kd||"score"]||KD.score;p.kl=p.kl||d0.l;p.bx=p.bx||d0.bx;p.ag=p.ag||d0.ag;p.tip=p.tip||d0.tip;
  if(!p.ap)p.ap=location.href.split("#")[0].split("?")[0].replace(/sign\.html$/,"");
  if(p.bx)$("boxT").textContent=p.bx;if(p.ag)$("agT").textContent=p.ag;if(p.tip)$("tipT").textContent=p.tip;
  if(!sc&&p.kl){var kk=document.createElement("div");kk.className="sub";kk.textContent=p.kl;$("title").insertAdjacentElement("afterend",kk)}
  $("who").textContent=[p.c,p.n?p.n+" 학생":"",p.s?"("+p.s+")":""].filter(Boolean).join(" ");
  $("scores").hidden=!(p.cols&&p.cols.length);
  $("scores").innerHTML=(p.cols||[]).map(function(c,i){return "<tr><td>"+esc(c)+"</td><td>"+esc((p.vals||[])[i]||"-")+"</td></tr>"}).join("");
  if(p.note){$("tnote").hidden=false;$("tnote").textContent="선생님: "+p.note}
  if(p.due){var d=new Date(p.due+"T00:00");$("due").textContent="서명 마감: "+(d.getMonth()+1)+"월 "+d.getDate()+"일"}
  $("to").textContent=p.to||"";$("scoreBox").hidden=false;$("signBox").hidden=false;
  var key="tl-sig:"+p.e+":"+p.s+":"+p.t;try{var saved=JSON.parse(localStorage.getItem(key)||"null");if(saved&&saved.url){replyUrl=saved.url;showSend()}}catch(e){}
  setup();
}).catch(function(e){fail(e.message||"링크를 읽지 못했습니다.")});
function setup(){
  var cv=$("cv"),pad=$("pad"),ctx=cv.getContext("2d");
  function size(){var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);draw()}
  function draw(){var k=cv.width/W;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle="#111";ctx.lineWidth=3*k;ctx.lineCap="round";ctx.lineJoin="round";
    strokes.forEach(function(a){ctx.beginPath();a.forEach(function(pt,i){var x=pt[0]*k,y=pt[1]*k;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(a.length===1)ctx.lineTo(a[0][0]*k+.1,a[0][1]*k);ctx.stroke()});
    $("hint").hidden=strokes.length>0;check()}
  function pos(e){var r=cv.getBoundingClientRect();return[Math.max(0,Math.min(W,Math.round((e.clientX-r.left)/r.width*W))),Math.max(0,Math.min(H,Math.round((e.clientY-r.top)/r.height*H)))]}
  cv.addEventListener("pointerdown",function(e){if(!$("ok").checked){$("ok").focus();toastAgree();return}e.preventDefault();cv.setPointerCapture(e.pointerId);cur=[pos(e)];strokes.push(cur);draw()});
  cv.addEventListener("pointermove",function(e){if(!cur)return;e.preventDefault();var p=pos(e),l=cur[cur.length-1];if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])<2)return;cur.push(p);draw()});
  function end(){cur=null;check()}
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  $("ok").onchange=function(){pad.classList.toggle("off",!$("ok").checked);$("hint").textContent=$("ok").checked?"여기에 손가락으로 서명하세요":"위 확인란을 체크한 뒤 여기에 손가락으로 서명하세요";check()};
  $("clear").onclick=function(){strokes=[];draw()};
  window.addEventListener("resize",size);size();
  $("send").onclick=finish;
}
function toastAgree(){var w=document.querySelector(".agree");w.style.outline="3px solid var(--bad)";setTimeout(function(){w.style.outline=""},900)}
function ink(){var n=0;strokes.forEach(function(a){n+=a.length});return n}
function check(){$("send").disabled=!($("ok").checked&&ink()>=8)}
function finish(){
  if(!$("ok").checked||ink()<8)return;
  var pts=strokes.map(function(a){var o=[],px=0,py=0;a.forEach(function(p){o.push(p[0]-px,p[1]-py);px=p[0];py=p[1]});return o});
  var reply={k:"sig",v:1,e:P.e,s:P.s,t:P.t,h:P.h,at:new Date().toISOString(),p:pts,w:W,hh:H};
  $("send").disabled=true;
  encode(reply).then(function(code){
    replyUrl=(P.ap||"").split("#")[0]+"#r="+code;
    try{localStorage.setItem("tl-sig:"+P.e+":"+P.s+":"+P.t,JSON.stringify({url:replyUrl,at:reply.at}))}catch(e){}
    showSend();
  });
}
function showSend(){
  $("signBox").hidden=true;$("sendBox").hidden=false;
  var subj="[서명] "+(P.ti||"수행평가")+" "+(P.n||"")+" 학생";
  var body=(P.n||"")+" 학생이 "+(P.ti||"수행평가")+(P.kd&&P.kd!=="score"?" 내용을 확인하고":" 점수를 확인하고")+" 서명했습니다.\n\n아래 링크를 누르면 선생님 앱에 서명이 들어갑니다.\n"+replyUrl+"\n";
  $("mail").href="mailto:"+encodeURIComponent(P.to||"")+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
  $("share").hidden=!navigator.share;
  $("share").onclick=function(){navigator.share({title:subj,text:body}).catch(function(){})};
  $("copy").onclick=function(){(navigator.clipboard?navigator.clipboard.writeText(replyUrl):Promise.reject()).then(function(){$("copy").textContent="복사했습니다"},function(){prompt("아래 링크를 길게 눌러 복사하세요",replyUrl)})};
  $("redo").onclick=function(){try{localStorage.removeItem("tl-sig:"+P.e+":"+P.s+":"+P.t)}catch(e){}strokes=[];$("sendBox").hidden=true;$("signBox").hidden=false;$("ok").checked=false;$("ok").onchange();window.dispatchEvent(new Event("resize"))};
}
})();
</script>
</body>
</html>
