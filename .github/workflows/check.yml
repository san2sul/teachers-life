# 교사의 생활 자동 점검: main에 올릴 때마다 tests/run_all.py(가짜 자료만 사용)를 돌립니다.
# 학생 자료 · 서버 · 비밀 키를 쓰지 않습니다. 실패해도 배포(GitHub Pages)는 막지 않습니다.
name: 자동 점검
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비 (크로미움 · 한글 글꼴)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install playwright pillow openpyxl
          python -m playwright install --with-deps chromium
      - name: 자동 점검 실행
        shell: bash
        run: |
          set -o pipefail
          python tests/run_all.py 2>&1 | tee run.log
      - name: 실패한 시험을 요약에 남기기
        if: failure()
        shell: bash
        run: |
          {
            echo "## 자동 점검 결과"
            grep -E "통과 ·" run.log || true
            echo
            echo "| 시험 | 기록 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for t in $(grep -E "^실패" run.log | awk '{print $2}'); do
            f="tests/_work/$t.log"
            msg=$( { grep -E "^FAIL" "$f" 2>/dev/null | head -5; grep -E "Error|Exception" "$f" 2>/dev/null | tail -2; } | cut -c1-200 )
            [ -z "$msg" ] && msg=$(tail -3 "$f" 2>/dev/null | cut -c1-200)
            echo "| $t | $(echo "$msg" | tr '\n' ' ' | sed 's/|/¦/g') |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=자동 점검 실패 $t::$(echo "$msg" | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tests/_work/*.log
            tests/_work/shot/
          retention-days: 7
