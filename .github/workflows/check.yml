# 교사의 생활 자동 점검: main에 올릴 때마다 tests/run_all.py(가짜 자료만 사용)를 돌립니다.
# 학생 자료 · 서버 · 비밀 키를 쓰지 않습니다. 실패해도 배포(GitHub Pages)는 막지 않습니다.
name: 자동 점검
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비 (크로미움 · 한글 글꼴)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install playwright pillow openpyxl
          python -m playwright install --with-deps chromium
      - name: 자동 점검 실행
        run: python tests/run_all.py
      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tests/_work/*.log
            tests/_work/shot/
          retention-days: 7
